apiVersion: batch/v1
kind: Job

metadata:
  name: hello-job

spec:
  template:
    spec:
      containers:
      - name: hello
        image: busybox
        command: ["echo", "Hello Kubernetes Job"]
      restartPolicy: Never


(commands) kubectl apply -f job.yaml
      kubectl get jobs
      kubectl get pods
      kubectl logs <pod-name>
