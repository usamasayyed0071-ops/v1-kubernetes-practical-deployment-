apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx   # MUST match template labels

  template:
    metadata:
      labels:
        app: nginx   # MUST match selector

    spec:
      containers:
      - name: nginx
        image: nginx:1.25   # you can change version here
        ports:
        - containerPort: 80
