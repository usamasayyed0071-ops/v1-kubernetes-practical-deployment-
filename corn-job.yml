apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron

spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            command: ["echo", "Hello from CronJob"]
          restartPolicy: Never


          kubectl apply -f cronjob.yaml
          kubectl get cronjob
          kubectl get jobs
          kubectl get pods
          kubectl logs <pod-name>
